name: Desktop build

# Builds installers for Linux and Windows with Tauri and attaches them to a GitHub
# release. macOS is deliberately left out: the runners are slow to come by and the
# builds would be unsigned anyway. Runs on a version tag (v0.7.0) or by hand from the Actions tab.
# This is how the app reaches testers: nobody needs a toolchain, they download the
# installer for their machine from the release page.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v0.7.0-test1)'
        required: true
        default: 'v0.7.0-test1'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri

      - name: Install
        run: npm ci

      - name: Build workspace packages
        run: npx tsc -b

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/app
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'CARDstock ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            Test build. Download the installer for your system:
            - Windows: the `-setup.exe` (or the `.msi`)
            - Linux: the `.deb` / `.rpm`, or the `.AppImage` (make it executable)

            Updating: run the new installer over the old one — it replaces the previous
            version, no uninstall needed. The `.AppImage` is a single file with no
            installer, so with that one just replace the old file.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
